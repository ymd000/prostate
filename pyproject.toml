[project]
name = "prostate"
version = "0.1.0"
description = "A fresh environment for prostate pathology image analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "h5py>=3,<4",
    "scipy>=1.15,<2",
    "timm>=1,<2",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "tqdm>=4.67,<5",
    "wsi-toolbox>=0.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["__archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["__archive", ".venv"]
pythonpath = ["."]
